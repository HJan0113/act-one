server:
  port: 10001

spring:
  application:
    name: act-one-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    url: ${ACT_ONE_DB_URL:jdbc:postgresql://localhost:5432/act_one?client_encoding=UTF8}
    username: ${ACT_ONE_DB_USERNAME:postgres}
    password: ${ACT_ONE_DB_PASSWORD:}
    hikari:
      connection-timeout: ${ACT_ONE_DB_CONNECTION_TIMEOUT:5000}
      idle-timeout: ${ACT_ONE_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${ACT_ONE_DB_MAX_LIFETIME:1800000}
      maximum-pool-size: ${ACT_ONE_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${ACT_ONE_DB_MIN_IDLE:5}
      pool-name: ActOneHikariPool

  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  timeout: ${ACT_ONE_AUTH_TOKEN_TTL_SECONDS:2592000}
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

ai:
  providers:
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions

  spring-ai:
    chat:
      enabled: true
      temperature: 0.3
      top-p: 0.9
      max-tokens: 16384
      timeout: 1000s

  chat:
    default-model: deepseek-v4-flash
    candidates:
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        enabled: true
        priority: 5
      - id: qwen3.7-max-2026-05-17
        provider: bailian
        model: qwen3.7-max-2026-05-17
        enabled: true
        priority: 3
      - id: deepseek-v4-flash
        provider: bailian
        model: deepseek-v4-flash
        enabled: true
        priority: 1

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

script:
  ai:
    max-stage-retries: ${ACT_ONE_SCRIPT_AI_MAX_STAGE_RETRIES:1}
    concurrency:
      chapter-summary-core-pool-size: ${ACT_ONE_SCRIPT_AI_CHAPTER_SUMMARY_CORE_POOL_SIZE:0}
      chapter-summary-max-pool-size: ${ACT_ONE_SCRIPT_AI_CHAPTER_SUMMARY_MAX_POOL_SIZE:0}
      chapter-summary-queue-capacity: ${ACT_ONE_SCRIPT_AI_CHAPTER_SUMMARY_QUEUE_CAPACITY:64}
      scene-planning-core-pool-size: ${ACT_ONE_SCRIPT_AI_SCENE_PLANNING_CORE_POOL_SIZE:0}
      scene-planning-max-pool-size: ${ACT_ONE_SCRIPT_AI_SCENE_PLANNING_MAX_POOL_SIZE:0}
      scene-planning-queue-capacity: ${ACT_ONE_SCRIPT_AI_SCENE_PLANNING_QUEUE_CAPACITY:32}
      yaml-generation-core-pool-size: ${ACT_ONE_SCRIPT_AI_YAML_GENERATION_CORE_POOL_SIZE:0}
      yaml-generation-max-pool-size: ${ACT_ONE_SCRIPT_AI_YAML_GENERATION_MAX_POOL_SIZE:0}
      yaml-generation-queue-capacity: ${ACT_ONE_SCRIPT_AI_YAML_GENERATION_QUEUE_CAPACITY:32}
    timeouts:
      chapter-summary: ${ACT_ONE_SCRIPT_AI_CHAPTER_SUMMARY_TIMEOUT:240s}
      scene-planning: ${ACT_ONE_SCRIPT_AI_SCENE_PLANNING_TIMEOUT:600s}
      script-yaml-generation: ${ACT_ONE_SCRIPT_AI_YAML_GENERATION_TIMEOUT:360s}
