server:
  port: 10001

spring:
  application:
    name: act-one-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    url: ${ACT_ONE_DB_URL:jdbc:postgresql://localhost:5432/act_one?client_encoding=UTF8}
    username: ${ACT_ONE_DB_USERNAME:postgres}
    password: ${ACT_ONE_DB_PASSWORD:}
    hikari:
      connection-timeout: ${ACT_ONE_DB_CONNECTION_TIMEOUT:5000}
      idle-timeout: ${ACT_ONE_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${ACT_ONE_DB_MAX_LIFETIME:1800000}
      maximum-pool-size: ${ACT_ONE_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${ACT_ONE_DB_MIN_IDLE:5}
      pool-name: ActOneHikariPool

  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  timeout: ${ACT_ONE_AUTH_TOKEN_TTL_SECONDS:2592000}
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

ai:
  providers:
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  spring-ai:
    chat:
      enabled: true
      temperature: 0.3
      top-p: 0.9
      max-tokens: 4096
      timeout: 60s

  chat:
    default-model: qwen3-max
    candidates:
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        enabled: true
        priority: 1
